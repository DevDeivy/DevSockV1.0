<div class="wrapper">
  <h1 style="cursor: pointer;" class="devsock" [routerLink]="['/home']">DevSock</h1>
    <div class="blur">
        <div class="register">
            <h2 class="title">Unete a Devsock</h2>
            <form class="form" [formGroup]="register" (ngSubmit)="registerUser()">
                <input type="text" placeholder="Nombre" class="input" formControlName="name">
                <input type="text" placeholder="Apellido" class="input" formControlName="lastName">
                <input type="email" placeholder="Correo electrónico" class="input" formControlName="email">
                <input type="password" placeholder="Contraseña" autocomplete="off" class="input" formControlName="password">
                <input type="password" placeholder="Confirmar contraseña" autocomplete="off" class="input" formControlName="confirm">
                <button class="component" [disabled]="register.invalid || confirmPassword()">Registrar</button>
                <p class="link">¿Ya tienes una cuenta? <a [routerLink]="['/login']">Inicia sesión</a></p>
            </form>
        </div>
    </div>
</div>
